<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/images/healthopia_logo_nobg.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Healthopia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
</head>
<body class="auth-page">
  <div class="auth-shell">
    <section class="auth-hero">
      <div class="auth-brand">
        <img class="auth-brand__logo" src="/images/healthopia_logo_nobg.png" alt="Healthopia logo">
        <span class="auth-brand__wordmark">Healthopia</span>
      </div>
      <h1>Create a new password</h1>
      <p class="auth-copy">
        Enter a strong password to secure your Healthopia account.
      </p>
    </section>

    <section class="auth-card">
      <div class="auth-card__header">
        <h2>Reset Password</h2>
        <p>Choose a new password for your account.</p>
      </div>

      <form id="reset-password-form" class="stack-form">
        <label class="field">
          <span>New Password</span>
          <div class="password-field">
            <input type="password" name="password" placeholder="Enter a strong password" autocomplete="new-password" required minlength="6">
            <button type="button" class="password-toggle" aria-label="Show password" data-input-name="password">
              <span class="material-symbols-outlined">visibility</span>
            </button>
          </div>
        </label>

        <label class="field">
          <span>Confirm Password</span>
          <div class="password-field">
            <input type="password" name="confirmPassword" placeholder="Confirm your password" autocomplete="new-password" required minlength="6">
            <button type="button" class="password-toggle" aria-label="Show password" data-input-name="confirmPassword">
              <span class="material-symbols-outlined">visibility</span>
            </button>
          </div>
        </label>

        <div id="auth-message" class="inline-message is-hidden" role="alert"></div>

        <button class="button-primary button-primary--full" type="submit">Reset Password</button>
      </form>

      <p class="auth-footer">
        <a href="/sign-in">Back to Sign In</a>
      </p>
    </section>
  </div>

  <script type="module" src="/js/reset-password.js"></script>
</body>
</html>
