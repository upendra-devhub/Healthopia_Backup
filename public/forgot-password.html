<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/images/healthopia_logo_nobg.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Healthopia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
</head>
<body class="auth-page">
  <div class="auth-shell">
    <section class="auth-hero">
      <div class="auth-brand">
        <img class="auth-brand__logo" src="/images/healthopia_logo_nobg.png" alt="Healthopia logo">
        <span class="auth-brand__wordmark">Healthopia</span>
      </div>
      <h1>Reset your password</h1>
      <p class="auth-copy">
        Enter your email address and we'll send you a link to reset your password.
      </p>
    </section>

    <section class="auth-card">
      <div class="auth-card__header">
        <h2>Forgot Password</h2>
        <p>We'll help you get back into your account.</p>
      </div>

      <form id="forgot-password-form" class="stack-form">
        <label class="field">
          <span>Email</span>
          <input type="email" name="email" placeholder="example@gmail.com" autocomplete="email" required>
        </label>

        <div id="auth-message" class="inline-message is-hidden" role="alert"></div>

        <button class="button-primary button-primary--full" type="submit">Send Reset Link</button>
      </form>

      <p class="auth-footer">
        Remember your password?
        <a href="/sign-in">Sign in</a>
      </p>
    </section>
  </div>

  <script type="module" src="/js/forgot-password.js"></script>
</body>
</html>
